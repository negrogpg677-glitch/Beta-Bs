plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brawlrush.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.brawlrush.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé de debug pour pouvoir s'installer directement
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
    androidResources { noCompress += ['ttf','mp3','ogg'] }
}
