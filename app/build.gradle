plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brawlrush.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.brawlrush.game"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "3.2"
    }

    flavorDimensions 'edition'
    productFlavors {
        prod { dimension 'edition'; resValue 'string', 'app_name', 'Brawl Rush' }
        dev { dimension 'edition'; applicationIdSuffix '.dev'; versionNameSuffix '-dev'; resValue 'string', 'app_name', 'Brawl Rush DEV' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé de debug pour pouvoir s'installer directement
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
    androidResources { noCompress += ['ttf','mp3','ogg'] }
}
