name: Compiler l'APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compiler
        run: chmod +x gradlew && ./gradlew assembleProdRelease assembleDevRelease --no-daemon
      - name: Renommer
        run: mkdir -p out && cp app/build/outputs/apk/prod/release/app-prod-release.apk out/BrawlRush.apk && cp app/build/outputs/apk/dev/release/app-dev-release.apk out/BrawlRush-DEV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrawlRush-APK
          path: out/*.apk
