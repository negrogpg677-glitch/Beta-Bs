name: Déployer le serveur (Fly.io)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'app/src/main/assets/www/js/**', 'Dockerfile', 'fly.toml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}   # Settings > Secrets > Actions (voir DEPLOY.md)
